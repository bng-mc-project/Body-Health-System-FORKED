plugins {
	id 'fabric-loom' version '1.11.8'
	id 'maven-publish'
}

def taczDev = project.hasProperty('taczDev') && project.property('taczDev') == 'true'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

sourceSets {
	taczRuntimeOnly {
		java.srcDirs = []
		resources.srcDirs = []
	}
}

loom {
	mixin {
		useLegacyMixinAp = true
	}

	mods {
		"bodyhealthsystemforked" {
			sourceSet taczDev ? sourceSets.taczRuntimeOnly : sourceSets.main
		}
	}

	if (taczDev) {
		runs {
			client {
				runDir = "run-tacz"
			}
		}
	}

	runs {
		clientTacz {
			client()
			name = "Minecraft Client (TACZ / Parchment)"
			ideConfigGenerated = taczDev
			runDir = "run-tacz"
		}
	}
}

repositories {
	mavenCentral()
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven {
		name = "ParchmentMC"
		url = "https://maven.parchmentmc.org"
	}
	// Fetch TemperatureAPI from GitHub Releases via Ivy
	ivy {
		url "https://github.com/32bitx64bit/TemperatureAPI/releases/download"
		patternLayout {
			artifact("/[revision]/[artifact]-[revision].[ext]")
		}
		metadataSources { artifact() }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	if (taczDev) {
		mappings loom.layered() {
			officialMojangMappings()
			parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
		}
	} else {
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	}

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "temperatureapi:temperatureapi:1.1.7@jar"
	modImplementation "io.github.llamalad7:mixinextras-fabric:0.5.0"
	annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.0"

	modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
		exclude module: "fabric-api"
	}

	if (taczDev) {
		modLocalRuntime files("${layout.buildDirectory.get()}/libs/${archives_base_name}-${version}.jar")
	}
}

if (taczDev) {
	tasks.register('installTaczMods', Copy) {
		group = 'fabric'
		description = 'Copies TACZ runtime jars into run-tacz/mods (preserves jar-in-jar nesting).'
		from('libs') {
			include 'TACZ-Refabricated-*.jar'
			include 'ForgeConfigAPIPort-*.jar'
		}
		into 'run-tacz/mods'
	}
}

if (taczDev) {
	tasks.named('compileJava').configure { enabled = false }
	tasks.named('compileTestJava').configure { enabled = false }

	tasks.named('runClient').configure {
		dependsOn 'installTaczMods'
		doFirst {
			def jarFile = file("${layout.buildDirectory.get()}/libs/${archives_base_name}-${version}.jar")
			if (!jarFile.exists()) {
				throw new GradleException(
						"Missing ${jarFile.name}. Run './gradlew runClientWithTacz' (builds the jar automatically)."
				)
			}
		}
	}

	tasks.named('runClientTacz').configure {
		dependsOn 'installTaczMods'
		doFirst {
			def jarFile = file("${layout.buildDirectory.get()}/libs/${archives_base_name}-${version}.jar")
			if (!jarFile.exists()) {
				throw new GradleException(
						"Missing ${jarFile.name}. Run './gradlew runClientWithTacz' (builds the jar automatically)."
				)
			}
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
	exclude 'com/tacz/**'
}

tasks.register('runClientWithTacz', GradleBuild) {
	group = 'fabric'
	description = 'Run Minecraft client with TACZ (Parchment mappings, same as TACZ Refabricated).'
	dependsOn 'remapJar'
	tasks = ['runClientTacz']
	startParameter.projectProperties = [taczDev: 'true']
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
